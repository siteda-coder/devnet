[project]
name = "ccie-auto"
version = "1.1.0"
description = "CCIE Automation"
requires-python = "==3.13.*"

dependencies = [
    "requests",
    "httpx",
    "pydantic",
    "pyats",
    "genie",
    "scrapli[asyncssh,ssh2,ttp]",
    "netmiko",
    "paramiko",
    "scrapli-netconf",
    "ncclient",
    "pyang",
    "textfsm",
    "fastapi",
    "flask",
    "flask-restx",
    "jinja2",
    "typer",
    "click",
    "hvac",
    "pyyaml",
    "ruamel.yaml",
    "lxml",
    "xmltodict",
    "colorama",
    "uvicorn",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "mypy",
    "types-requests",
    "types-Flask",
    "ipdb",
    "pdbpp",
    "ipython",
    "bpython",
    "pytest",
    "rich",
    "types-pyyaml",
]
